# Render Blueprint: one free web service runs BOTH the API and the website.
# FastAPI answers /api/*, and serves the built React app (frontend/dist) + content (data/) for everything else.
services:
  - type: web
    name: saathi-up-heritage
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false   # Render asks you to paste the key once, in its dashboard (never commit it)
